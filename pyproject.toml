[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stemtosheet"
version = "0.1.0"
description = "Turn piano MIDI (e.g. RipX stem exports) into printable sheet music."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "music21>=9.1",
    "mido>=1.3",
    "numpy>=1.24",
    "verovio>=4.3",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stemtosheet-cli = "stemtosheet.cli:main"

[project.gui-scripts]
stemtosheet = "stemtosheet.gui:main"

[tool.setuptools]
packages = ["stemtosheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
